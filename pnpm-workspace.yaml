# map of package matchers to explicitly allow (true) or disallow (false) script execution
allowBuilds:
  '@swc/core': false
  core-js: false

# deny any execution of any (unreviewed) build scripts
strictDepBuilds: true

# only direct dependencies (listed in package.json) may use exotic sources (like git or tarball URLs)
blockExoticSubdeps: true

# Refuse to install package versions younger than 3 days (4320 minutes).
# Most malicious releases are detected and unpublished within hours; the
# cooldown means our installs never see them.
minimumReleaseAge: 4320

# Pin transitive dependencies. pnpm 11 dropped the package.json "pnpm" field,
# so overrides live here.
#   qs: GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g (both fixed in 6.16.0)
overrides:
  copy-webpack-plugin: 14.0.0
  css-minimizer-webpack-plugin: 8.0.0
  body-parser: ^1.20.6
  brace-expansion: ^1.1.18
  fast-uri: ^3.1.5
  postcss: ^8.5.23
  qs: ^6.16.0
  serialize-javascript: ^7.0.5
  svgo: ^3.3.4
  undici: ^7.29.0
  uuid: ^11.1.1
